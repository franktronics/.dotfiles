config-version = 2
after-startup-command = []
start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

[key-mapping]
    preset = 'qwerty'

[gaps]
    inner.horizontal = 4
    inner.vertical =   4
    outer.left =       4
    outer.bottom =     4
    outer.top =        4
    outer.right =      4

[mode.main.binding]
    cmd-slash = 'layout tiles horizontal vertical'
    cmd-comma = 'layout accordion horizontal vertical'

    cmd-h = 'focus left'
    cmd-j = 'focus down'
    cmd-k = 'focus up'
    cmd-l = 'focus right'

    cmd-shift-h = 'move left'
    cmd-shift-j = 'move down'
    cmd-shift-k = 'move up'
    cmd-shift-l = 'move right'
    cmd-shift-f = 'layout floating tiling'

    cmd-u = 'resize smart -50'
    cmd-i = 'resize smart +50'

    cmd-1 = 'workspace 1'
    cmd-2 = 'workspace 2'
    cmd-3 = 'workspace 3'
    cmd-4 = 'workspace 4'
    cmd-5 = 'workspace 5'
    cmd-6 = 'workspace 6'
    cmd-7 = 'workspace 7'
    cmd-8 = 'workspace 8'

    cmd-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
    cmd-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
    cmd-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
    cmd-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
    cmd-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'
    cmd-shift-6 = 'move-node-to-workspace 6 --focus-follows-window'
    cmd-shift-7 = 'move-node-to-workspace 7 --focus-follows-window'
    cmd-shift-8 = 'move-node-to-workspace 8 --focus-follows-window'

    cmd-tab = 'workspace-back-and-forth'
    cmd-shift-tab = 'move-workspace-to-monitor --wrap-around next'
    cmd-shift-semicolon = 'mode service'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']
    f = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']

    cmd-shift-h = ['join-with left', 'mode main']
    cmd-shift-j = ['join-with down', 'mode main']
    cmd-shift-k = ['join-with up', 'mode main']
    cmd-shift-l = ['join-with right', 'mode main']

down = 'volume down'
up = 'volume up'
shift-down = ['volume set 0', 'mode main']

[[on-window-detected]]
    if.app-id = 'com.apple.finder'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.spotify.client'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.ScreenSharing'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.FaceTime'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.Notes'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.github.Electron'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.iCal'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.mail'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'net.whatsapp.WhatsApp'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'net.freemacsoft.AppCleaner'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.iphonesimulator'
    run = 'layout floating'
