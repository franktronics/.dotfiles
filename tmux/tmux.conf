set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -s extended-keys on
set -as terminal-features ",xterm-ghostty:extkeys"
set -sg escape-time 10

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi

# Status bar
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#0d1117,fg=#c9d1d9"
set -g message-style "bg=#58a6ff,fg=#0d1117,bold"
set -g pane-border-style "fg=#30363d"
set -g pane-active-border-style "fg=#58a6ff"

set -g status-left-length 40
set -g status-left "#[bg=#1f6feb,fg=#ffffff,bold] #S #[bg=#0d1117,fg=#1f6feb]"

set -g window-status-format " #[fg=#8b949e]#I:#W "
set -g window-status-current-format "#[bg=#161b22,fg=#58a6ff,bold] #I:#W #[default]"

set -g status-right-length 80
set -g status-right "#{?client_prefix,#[bg=#f85149,fg=#0d1117,bold] PREFIX #[default],} #[fg=#8b949e]%H:%M #[fg=#30363d]| #[fg=#8b949e]#H "

unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind z resize-pane -Z

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

run '~/.tmux/plugins/vim-tmux-navigator/vim-tmux-navigator.tmux'
